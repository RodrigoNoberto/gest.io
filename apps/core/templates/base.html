{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gext.io - {% block title %}App{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logotipo.svg' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

<aside class="sidebar collapsed" id="sidebar">
  <div class="sidebar-top">
    <button class="hamburger" id="toggleBtn" aria-label="Expandir menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <nav class="nav">
    <button class="nav-item {% block nav_inicio %}{% endblock %}" title="Início" onclick="window.location='/'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Início</span>
    </button>

    <button class="nav-item {% block nav_produtos %}{% endblock %}" title="Produtos" onclick="window.location='/produtos/'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
          <path d="M3.3 7 12 12l8.7-5" />
          <path d="M12 22V12" />
        </svg>
      <span class="nav-label">Produtos</span>
    </button>

    <button class="nav-item {% block nav_sobre %}{% endblock %}" title="Sobre" onclick="window.location='/sobre'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">Sobre</span>
    </button>
  </nav>
</aside>

<div class="main">
  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-brand">
      <img class="footer-logo" src="{% static 'img/logotipo.svg' %}">
      <span>2026 Rodrigo César.</span>
    </div>
    <span class="ver">v1.0.0</span>
  </footer>
</div>

<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
